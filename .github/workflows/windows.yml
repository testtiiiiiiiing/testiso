name: Windows tests and executable
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test desktop and backend
        env:
          WINSLIM_REQUIRE_GUI: '1'
        run: python -m unittest discover -s tests -v
      - name: Validate generated PowerShell scripts
        shell: pwsh
        run: |
          python tools/export_test_scripts.py "$env:RUNNER_TEMP/winslim-scripts"
          $failed = $false
          Get-ChildItem "$env:RUNNER_TEMP/winslim-scripts/*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Build portable EXE
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --paths . --name WinSlim_Studio_4_0 tools/windows_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: WinSlim-Studio-4-Windows
          path: dist/WinSlim_Studio_4_0.exe
